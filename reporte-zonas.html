<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>Reporte de zonas · MOS</title>
<style>
:root,[data-theme=light]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2f8; --line:#d9e0ea; --txt:#0b1220; --mut:#475569; --dim:#64748b;
  --acc:#1d4ed8; --acc-t:#ffffff; --sombra:0 1px 2px rgba(15,23,42,.06),0 6px 18px -8px rgba(15,23,42,.18);
  --c-venta:#2563eb; --c-costo:#94a3b8; --c-margen:#0d9488; --c-pers:#7c3aed; --c-queda:#16a34a; --c-fijo:#ea580c; --c-bad:#dc2626; --c-warn:#b45309;
  --ok-bg:#dcfce7; --ok-tx:#166534; --bad-bg:#fee2e2; --bad-tx:#991b1b; --warn-bg:#fef3c7; --warn-tx:#92400e; --info-bg:#dbeafe; --info-tx:#1e3a8a;
  --hijo:#f8fafc;
}
[data-theme=dark]{
  --bg:#020817; --panel:#0b1324; --panel2:#132036; --line:#24324a; --txt:#f1f5f9; --mut:#a3b1c6; --dim:#7c8ba1;
  --acc:#fbbf24; --acc-t:#1a1200; --sombra:none;
  --c-venta:#60a5fa; --c-costo:#64748b; --c-margen:#2dd4bf; --c-pers:#a78bfa; --c-queda:#22c55e; --c-fijo:#fb923c; --c-bad:#f87171; --c-warn:#fbbf24;
  --ok-bg:rgba(34,197,94,.16); --ok-tx:#86efac; --bad-bg:rgba(239,68,68,.16); --bad-tx:#fca5a5; --warn-bg:rgba(245,158,11,.14); --warn-tx:#fcd34d; --info-bg:rgba(96,165,250,.12); --info-tx:#bfdbfe;
  --hijo:#0f1a30;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{padding:max(12px,env(safe-area-inset-top)) 16px 48px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.top h1{margin:0;font-size:22px;flex:1;min-width:190px;letter-spacing:-.01em}
.top .gen{font-size:12.5px;color:var(--mut);width:100%;order:3}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;min-height:42px;box-shadow:var(--sombra)}
.btn:active{transform:scale(.97)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap;box-shadow:var(--sombra)}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:700;color:var(--mut);min-height:40px}
.seg button.on{background:var(--acc);color:var(--acc-t)}
.seg.sm button{padding:7px 11px;min-height:36px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sombra);border-top:5px solid var(--k)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:900;margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.kpi .s{font-size:13px;color:var(--mut);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}
.card h2{margin:0 0 2px;font-size:18px;letter-spacing:-.01em}
.card .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
.num{font-variant-numeric:tabular-nums}
.avisos{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.aviso{font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--info-bg);color:var(--info-tx)}
.aviso.amb{background:var(--warn-bg);color:var(--warn-tx)}
.aviso a{color:inherit;font-weight:800}
svg text{font-family:inherit}
.chart{width:100%;display:block;touch-action:manipulation}
.explica{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:15px;min-height:48px}
.explica b{font-size:16.5px}
.dn-wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;align-items:center}
.dn{width:100%;max-width:360px;margin:0 auto;display:block;touch-action:manipulation}
.dn path{cursor:pointer;transition:opacity .2s}
.dn-side h3{margin:0 0 4px;font-size:18px}
.dn-side .fr{font-size:15px;margin-bottom:10px}
.dn-it{display:grid;grid-template-columns:14px 1fr auto auto;gap:4px 10px;align-items:center;padding:8px;border-radius:9px;cursor:pointer;min-height:42px}
.dn-it:hover,.dn-it.on{background:var(--panel2)}
.dn-it i{width:14px;height:14px;border-radius:4px}
.dn-it .n{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-it .v{font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.dn-it .p{color:var(--mut);font-size:13px;text-align:right;min-width:48px}
.dn-back{margin-bottom:8px}
@media (max-width:760px){ .dn-wrap{grid-template-columns:1fr} }
.btn.cf{background:var(--acc);color:var(--acc-t);border-color:transparent}
.cf-ov{position:fixed;inset:0;background:rgba(2,8,23,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.cf-pn{background:var(--panel);color:var(--txt);border-radius:18px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px -10px rgba(0,0,0,.45)}
.cf-hd{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.cf-hd h2{margin:0 0 2px;font-size:19px}
.cf-bd{padding:12px 18px;overflow:auto;flex:1}
.cf-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cf-row{display:grid;grid-template-columns:1fr 120px 128px 40px;gap:8px;align-items:center;margin-bottom:8px}
.cf-row input,.cf-row select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--txt);font:inherit}
.cf-row input.m{text-align:right;font-weight:800}
.cf-del{width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.cf-pre{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.cf-pre button{border:1px dashed var(--line);background:var(--panel2);border-radius:999px;padding:7px 11px;font-size:13.5px;font-weight:700;min-height:38px}
.cf-pre button:hover{border-color:var(--acc)}
.cf-sum{font-size:14px;flex:1;min-width:200px}
.cf-sum b{font-size:16px}
.cf-msg{font-size:13px;padding:8px 10px;border-radius:9px;margin-top:8px}
@media (max-width:620px){
  .cf-ov{align-items:flex-end;padding:0}
  .cf-pn{border-radius:18px 18px 0 0;max-height:94vh}
  .cf-row{grid-template-columns:1fr 1fr 40px} .cf-row .c{grid-column:1/-1}
}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar input{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font:inherit;min-height:42px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:800;background:var(--panel)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr.padre{cursor:pointer}
tr.padre:hover td{background:var(--panel2)}
tr.padre td:first-child{font-weight:800}
.tg{display:inline-block;width:16px;color:var(--mut);transition:transform .15s}
tr.padre.ab .tg{transform:rotate(90deg)}
tr.hijo td{font-size:14px;background:var(--hijo);color:var(--txt)}
tr.hijo td:first-child{padding-left:30px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.c-real{background:var(--ok-bg);color:var(--ok-tx)}
.c-padre{background:var(--info-bg);color:var(--info-tx)}
.c-est{background:var(--warn-bg);color:var(--warn-tx)}
.c-bad{background:var(--bad-bg);color:var(--bad-tx)}
.m-ok{color:var(--c-queda);font-weight:900}.m-mid{color:var(--c-warn);font-weight:900}.m-bad{color:var(--c-bad);font-weight:900}
.mut{color:var(--mut)}
.mas{width:100%;margin-top:10px}
.tot td{font-weight:900;border-top:2px solid var(--txt);border-bottom:0}
.estado{padding:48px 10px;text-align:center;color:var(--mut)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 10px;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.scroll{overflow-x:auto}
/* margen */
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 10px;align-items:center}
.hb .n{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{position:relative;height:26px;background:var(--panel2);border-radius:7px;overflow:hidden}
.hb .b i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .5s ease}
.hb .b > span{position:absolute;left:8px;top:3px;font-size:13px;font-weight:800;white-space:nowrap}
.pareto{font-size:15.5px;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--panel2)}
/* simulador */
.sim-grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.ctl{display:flex;flex-direction:column;gap:14px}
.ctl label.t{display:block;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:6px}
.ctl .seg{width:100%}
.ctl .seg button{flex:1}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;accent-color:var(--acc);height:30px}
.rng .val{min-width:84px;text-align:center;font-weight:900;font-size:20px;background:var(--panel2);border-radius:10px;padding:5px 8px}
.rng .pm{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:18px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px dashed var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.presets button:hover{border-color:var(--acc)}
.jefa{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.jefa .fr{font-size:16px;margin-bottom:10px}
.jefa .fr b.big{font-size:22px}
.jefa .row{display:grid;grid-template-columns:90px 1fr 96px;gap:8px;align-items:center;margin:6px 0}
.jefa .row .k{font-size:13px;font-weight:800;color:var(--mut)}
.jefa .row .q{text-align:right;font-weight:900;font-size:16px}
.jbar{display:flex;height:32px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.jbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;min-width:0;transition:width .35s ease}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.res .r{border-radius:14px;padding:12px 14px;background:var(--panel2)}
.res .r .l{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.res .r .v{font-size:25px;font-weight:900;letter-spacing:-.02em}
.res .r .s{font-size:13px;color:var(--mut)}
.res .r.good{background:var(--ok-bg)} .res .r.good .v{color:var(--ok-tx)}
.res .r.badr{background:var(--bad-bg)} .res .r.badr .v{color:var(--bad-tx)}
.claves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.claves div{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.claves .cv{font-size:20px;font-weight:900;display:block;margin-top:4px}
.solo-m{display:none}
.dcol{min-width:110px}
.dbar{display:inline-block;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs > div{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vs h3{margin:0 0 6px;font-size:16px}
.vs ul{margin:0;padding-left:18px;font-size:14px}
.vs li{margin:3px 0}
.reco{margin-top:12px;padding:14px;border-radius:14px;border:2px solid var(--acc);font-size:15px}
.cmp td,.cmp th{font-size:14px}
.cmp tr.sel td{background:var(--panel2);font-weight:800}
.cmp tr{cursor:pointer}
@media (max-width:860px){ .sim-grid{grid-template-columns:1fr} }
@media (max-width:760px){
  body{font-size:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:22px}
  .jefa .row{grid-template-columns:1fr 84px} .jefa .row .k{grid-column:1/-1;margin-bottom:-4px}
  .res{grid-template-columns:1fr 1fr} .res .r:last-child{grid-column:span 2}
  .res .r .v{font-size:21px}
  .claves,.vs{grid-template-columns:1fr}
  .hide-m{display:none}
  .solo-m{display:inline}
  .dcol{min-width:0} .dcol .dbar{display:none}
  table{font-size:13px} tr.hijo td{font-size:12.5px}
  th,td{padding:8px 5px} th{font-size:10px}
  tr.padre td:first-child,tr.hijo td:first-child{min-width:118px}
  tr.hijo td:first-child{padding-left:16px}
  .chip{margin-left:0;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📋 Reporte de zonas</h1>
    <button class="btn cf" id="btnCF" title="Alquiler, luz, agua, internet y otros gastos fijos del local">🏠 Costos fijos</button>
    <button class="btn" id="btnTema" title="Cambiar entre fondo claro y oscuro">🌙</button>
    <button class="btn" id="btnFull" title="Pantalla completa para exponer">⛶</button>
    <button class="btn" id="btnAct" title="Volver a consultar la base">↻</button>
    <span class="gen" id="gen"></span>
  </div>

  <div class="filtros">
    <div class="seg" id="fZona">
      <button data-v="TODAS">Todas</button>
      <button data-v="ZONA-01">Zona 01</button>
      <button data-v="ZONA-02">Zona 02</button>
    </div>
    <div class="seg" id="fDias">
      <button data-v="1">Hoy</button>
      <button data-v="7">7 días</button>
      <button data-v="28">4 semanas</button>
    </div>
  </div>

  <div id="cuerpo"><div class="estado"><div class="spin"></div>Cargando…</div></div>
</div>

<script>
'use strict';
const SB_URL  = 'https://rzbzdeipbtqkzjqdchqk.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6YnpkZWlwYnRxa3pqcWRjaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzYwMDQsImV4cCI6MjA5NjQ1MjAwNH0.MAlSdz_ugGUZoaU5st6dA_gb_x_IiUL0TXxH176kY9k';

const st = { zona: 'TODAS', dias: 28, data: null, abiertos: new Set(), q: '', orden: 'venta', verTodos: false,
  diaMet: 'todo', diaSel: null, cascSel: null, mgModo: 'gana',
  sim: { modo: 'mixto', base: 'venta', fijo: 20, pct: { venta: 2, utilidad: 10 } }, grupos: null };
const cache = {};
let tok = null;
const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (_) { return null; } };
(() => { const g = LS('mos_reporte_zonas_filtros'); if (g) { st.zona = g.zona || st.zona; st.dias = g.dias || st.dias; }
  const s = LS('mos_reporte_zonas_sim'); if (s && s.pct) Object.assign(st.sim, s);
  st.vista = LS('mos_reporte_zonas_vista') || 'dona';
  const t = LS('mos_reporte_zonas_tema'); if (t) document.documentElement.dataset.theme = t; })();

// ── utilidades ─────────────────────────────────────────────
const nf2 = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 0 });
const S  = n => 'S/ ' + nf2.format(Number(n) || 0);
const S0 = n => (n < 0 ? '−' : '') + 'S/ ' + nf0.format(Math.abs(Number(n) || 0));
const pct = (a, b) => b ? (a / b * 100) : 0;
const P1 = n => (Math.round(n * 10) / 10).toLocaleString('es-PE') + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function kS(v) { const a = Math.abs(v); return (v < 0 ? '−' : '') + (a >= 1000 ? (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace('.', ',') + 'k' : Math.round(a)); }
function qty(n, peso, um) {
  n = Number(n) || 0;
  if (peso || /^(KGM|KG)$/i.test(um || '')) return (n < 1 && n > 0 ? nf0.format(n * 1000) + ' g' : (Math.round(n * 1000) / 1000).toLocaleString('es-PE') + ' kg');
  if (/^(LTR|L)$/i.test(um || '')) return (Math.round(n * 1000) / 1000).toLocaleString('es-PE') + ' L';
  return (Math.round(n * 100) / 100).toLocaleString('es-PE') + ' und';
}
function mClase(m) { return m < 0 ? 'm-bad' : (m < 15 ? 'm-mid' : 'm-ok'); }
function chipOrigen(o) {
  if (o === 'REAL') return '<span class="chip c-real" title="Costo registrado en el catálogo">costo real</span>';
  if (o === 'PADRE') return '<span class="chip c-padre" title="Costo del padre × su fracción (ej. ½ kg = mitad del costo del kilo)">del padre</span>';
  if (o === 'DUDOSO') return '<span class="chip c-bad" title="El costo del catálogo es igual o mayor que el precio de venta: parece mal cargado. Se usó el 15%.">costo dudoso</span>';
  if (o === 'MIXTO') return '<span class="chip c-est" title="Una parte con costo y otra estimada al 15%">parcial</span>';
  return '<span class="chip c-est" title="Sin costo registrado: se asume margen de 15%">est. 15%</span>';
}
function fmtDia(d, corto) {
  const f = new Date(String(d).slice(0, 10) + 'T12:00:00');
  return f.toLocaleDateString('es-PE', corto ? { day: 'numeric' } : { weekday: 'long', day: 'numeric', month: 'short' });
}
function fetchTO(url, opts, ms) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 20000);
  return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t));
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

// ── datos ──────────────────────────────────────────────────
async function token() {
  if (tok && tok.exp > Date.now() / 1000 + 60) return tok.t;
  let dev = '';
  try { dev = localStorage.getItem('mos_device_id') || ''; } catch (_) {}
  if (!dev) throw new Error('SIN_DISPOSITIVO');
  const r = await fetchTO(SB_URL + '/functions/v1/mint-mos', {
    method: 'POST', headers: { apikey: SB_ANON, 'Content-Type': 'application/json' }, cache: 'no-store',
    body: JSON.stringify({ deviceId: dev })
  }, 9000);
  const d = await r.json().catch(() => null);
  if (!d || !d.ok || !d.token) throw new Error('SIN_PERMISO');
  tok = { t: d.token, exp: d.exp || (Date.now() / 1000 + 1500) };
  return tok.t;
}
// ── costos fijos (1051) ─────────────────────────────────────
const CF_PRE = [['Alquiler', '🏠'], ['Luz', '💡'], ['Agua', '🚰'], ['Internet', '📶'], ['Teléfono / celular', '📱'], ['Arbitrios / municipalidad', '🏛️'],

    h += parts.map((p, i) => '<div class="dn-it" data-i="' + i + '"><i style="background:' + colP(i) + '"></i><span class="n">' + p.k + ' ›</span><span class="v">' + S0(p.v) + '</span><span class="p">' + P1(pct(p.v, tot0)) + '</span></div>').join('');
    h += '<div class="mut" style="font-size:12.5px;margin-top:6px">Toca una fila o una parte del círculo para dividirla.</div>';
    if (queda < 0) h += '<div class="aviso amb" style="margin-top:8px">Falta ' + S0(-queda) + ': el margen no alcanzó para personal' + (tot().fijos > 0 ? ' y costos fijos' : '') + '.</div>';
    if (!tot().fijos) h += '<div style="margin-top:8px"><button class="btn" onclick="abrirCF()">🏠 Agregar costos fijos</button></div>';
  } else {
    const p = parts[sel];
    h += '<button class="btn dn-back" id="dnBack">‹ Volver al total</button><h3>' + p.k + ': ' + S0(p.v) + '</h3><div class="fr">' + p.tx + ' <span class="mut">' + p.subT + ':</span></div>';
    if (!sub.length) h += '<div class="mut">' + (p.subNota || 'Sin detalle en este periodo.') + '</div>';
    const st0 = subPos.reduce((t, x) => t + x.v, 0) || 1;
    h += sub.map((x, j) => '<div class="dn-it' + (st.dnSub === j ? ' on' : '') + '" data-j="' + j + '"><i style="background:' + (x.v > 0 ? SUBCOL[j % SUBCOL.length] : css('--c-bad')) + '"></i><span class="n" title="' + esc(x.n) + '">' + esc(x.n) + '</span><span class="v' + (x.v < 0 ? ' m-bad' : '') + '">' + S0(x.v) + '</span><span class="p">' + (x.v > 0 ? P1(pct(x.v, st0)) : '') + '</span></div>').join('');
  }
  $('dnSide').innerHTML = h;
  $('dnSide').querySelectorAll('.dn-it[data-i]').forEach(el => el.addEventListener('click', () => { st.dnSel = +el.dataset.i; st.dnSub = null; pintarDona(); }));
  $('dnSide').querySelectorAll('.dn-it[data-j]').forEach(el => el.addEventListener('click', () => { const j = +el.dataset.j; st.dnSub = st.dnSub === j ? null : j; pintarDona(); }));
  if ($('dnBack')) $('dnBack').addEventListener('click', () => { st.dnSel = null; st.dnSub = null; pintarDona(); });
}

// ── 1b. CASCADA ────────────────────────────────────────────
function pintarCascada() {
  const svg = $('cCasc'); if (!svg) return;
  const { venta, costo, uti, pers, fijos, queda } = tot();
  const pasos = [
    { k: 'Vendimos', v: venta, from: 0, to: venta, col: '--c-venta', tx: 'Todo lo que cobramos en caja: <b>' + S0(venta) + '</b>.' },
    { k: 'Mercadería', v: -costo, from: venta, to: venta - costo, col: '--c-costo', tx: 'Lo que nos costó la mercadería que vendimos: <b>' + S0(costo) + '</b> (' + P1(pct(costo, venta)) + ' de la venta).' },
    { k: 'Margen', v: uti, from: 0, to: uti, col: '--c-margen', tx: 'Lo que ganamos con los productos antes de pagar al personal: <b>' + S0(uti) + '</b>. De cada S/ 100 vendidos, <b>S/ ' + pct(uti, venta).toFixed(0) + '</b> son margen.' },
    { k: 'Personal', v: -pers, from: uti, to: uti - pers, col: '--c-pers', tx: 'Lo que pagamos al personal de la zona: <b>' + S0(pers) + '</b>. Se come el <b>' + pct(pers, uti || 1).toFixed(0) + '%</b> del margen.' },
    ...(fijos > 0 ? [{ k: 'Costos fijos', v: -fijos, from: uti - pers, to: queda, col: '--c-fijo', tx: 'Alquiler, luz, agua y demás gastos del local en el periodo: <b>' + S0(fijos) + '</b> (' + S0(cfDia()) + ' por día).' }] : []),
    { k: queda < 0 ? 'Falta' : (fijos > 0 ? 'Neto' : 'Queda'), v: queda, from: 0, to: queda, col: queda < 0 ? '--c-bad' : '--c-queda', tx: queda >= 0
      ? 'Después de pagar mercadería, personal' + (fijos > 0 ? ' y costos fijos' : '') + ', nos <b>quedan ' + S0(queda) + '</b>: S/ ' + pct(queda, venta).toFixed(1) + ' por cada S/ 100 vendidos.' + (st.zona === 'TODAS' && st.data.almacen && +st.data.almacen.total ? ' (Antes de descontar almacén: ' + S0(st.data.almacen.total) + '.)' : '')
      : 'El margen <b>no alcanzó</b> para pagar personal' + (fijos > 0 ? ' y costos fijos' : '') + ': faltan <b>' + S0(-queda) + '</b>.' }
  ];
  const W = Math.max(320, svg.clientWidth || 700), H = W < 560 ? 250 : 300, pl = 8, pr = 8, pt = 34, pb = 34;
  const lo = Math.min(0, queda), hi = Math.max(venta, 1);
  const y = v => pt + (H - pt - pb) * (hi - v) / (hi - lo || 1);
  const n = pasos.length, bw = (W - pl - pr) / n, g = Math.min(28, bw * 0.24);
  let s = '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="' + css('--line') + '" stroke-width="2"/>';
  pasos.forEach((p, i) => {
    const x0 = pl + i * bw + g / 2, w = bw - g;
    const top = y(Math.max(p.from, p.to)), bot = y(Math.min(p.from, p.to));
    const sel = (st.cascSel == null || st.cascSel >= n ? n - 1 : st.cascSel) === i;
    s += '<g class="cb" data-i="' + i + '" style="cursor:pointer">'
      + '<rect x="' + (pl + i * bw) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/>'
      + '<rect x="' + x0 + '" y="' + top + '" width="' + w + '" height="' + Math.max(2, bot - top) + '" rx="8" fill="' + css(p.col) + '" opacity="' + (sel ? 1 : .55) + '" ' + (sel ? 'stroke="' + css('--txt') + '" stroke-width="2.5"' : '') + '>'
      + '<animate attributeName="height" from="0" to="' + Math.max(2, bot - top) + '" dur=".5s" fill="freeze"/></rect>'
      + '<text x="' + (x0 + w / 2) + '" y="' + (top - 9) + '" text-anchor="middle" font-size="' + (W < 560 ? 13 : 16) + '" font-weight="900" fill="' + css(p.v < 0 ? '--mut' : p.col === '--c-bad' ? '--c-bad' : '--txt') + '">' + (p.v < 0 ? '−' : '') + kS(Math.abs(p.v)) + '</text>'
      + '<text x="' + (x0 + w / 2) + '" y="' + (H - 11) + '" text-anchor="middle" font-size="' + (W < 560 ? 12 : 14) + '" font-weight="800" fill="' + css('--mut') + '">' + p.k + '</text></g>';
    if (i < n - 1) { const nx = pasos[i + 1]; const yy = y(p.to); s += '<line x1="' + (x0 + w) + '" x2="' + (pl + (i + 1) * bw + g / 2) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + css('--dim') + '" stroke-dasharray="4 4"/>'; }
  });
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('height', H); svg.innerHTML = s;
  $('cascTxt').innerHTML = pasos[st.cascSel == null || st.cascSel >= n ? n - 1 : st.cascSel].tx;
  svg.querySelectorAll('.cb').forEach(b => b.addEventListener('click', () => { st.cascSel = +b.dataset.i; pintarCascada(); }));
}

// ── 2. DÍA A DÍA ───────────────────────────────────────────
function pintarDias() {
  const svg = $('cDias'); if (!svg) return;
  const cfd = cfDia();
  const D = (st.data.diario || []).map(x => { const v = +x.venta, u = +x.utilidad, pe = +x.personal;
    return { dia: x.dia, venta: v, utilidad: u, merc: Math.max(0, v - u), personal: pe, fijos: cfd, queda: u - pe - cfd }; });
  const met = st.diaMet;
  const { venta: vT, uti: uT } = tot();
  const mRatio = vT > 0 ? uT / vT : 0;
  // equilibrio: costo diario promedio (personal en días con operación + costos fijos) y la venta que lo cubre con el margen real
  const dOp = D.filter(x => x.venta > 0 || x.personal > 0);
  const costoDia = (dOp.length ? dOp.reduce((a, x) => a + x.personal, 0) / dOp.length : 0) + cfd;
  const eqVenta = mRatio > 0 ? costoDia / mRatio : null;
  const eq = met === 'todo' || met === 'venta' ? eqVenta : met === 'utilidad' ? costoDia : 0;
  const cubrio = D.filter(x => (x.venta > 0 || x.personal > 0) && x.queda >= 0).length;
  // valores para la escala
  const val = x => met === 'todo' ? x.venta : x[met];
  const topDe = x => met === 'todo' ? Math.max(x.venta, x.merc + x.personal + x.fijos) : val(x);
  const vals = D.map(val);
  const W = Math.max(320, svg.clientWidth || 700), H = W < 560 ? 240 : 290, pl = 44, pr = 8, pt = 26, pb = 26;
  const hi = niceMax(Math.max(1, eq || 0, ...D.map(topDe))) , mn = Math.min(0, ...vals);
  const lo = mn < 0 ? -niceMax(-mn) : 0;
  const y = v => pt + (H - pt - pb) * (hi - v) / (hi - lo);
  const bw = (W - pl - pr) / D.length, gap = Math.max(2, Math.min(8, bw * 0.25));
  const conVenta = D.filter(x => x.venta > 0);
  const prom = conVenta.length ? conVenta.reduce((a, x) => a + val(x), 0) / conVenta.length : 0;
  let iMax = 0; vals.forEach((v, i) => { if (v > vals[iMax]) iMax = i; });
  if (st.diaSel == null || st.diaSel >= D.length) st.diaSel = D.length - 1;
  let s = '<defs><pattern id="rayas" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="' + css('--bad-bg') + '"/><rect width="3" height="6" fill="' + css('--c-bad') + '"/></pattern></defs>';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, yy = y(v); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + css('--line') + '"/><text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="' + css('--dim') + '">' + kS(v) + '</text>'; }
  const paso = Math.ceil(D.length / (W < 560 ? 7 : 14));
  D.forEach((x, i) => {
    const x0 = pl + i * bw + gap / 2, w = bw - gap, sel = st.diaSel === i, op = sel ? 1 : .8;
    const rx = Math.min(4, w / 3);
    s += '<g class="db" data-i="' + i + '" style="cursor:pointer"><rect x="' + (pl + i * bw) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/>';
    if (met === 'todo') {
      // una sola barra: lo vendido partido en mercadería · personal · costos fijos · neto; lo que faltó, rayado rojo encima
      let acc = 0;
      const partes = [[x.merc, '--c-costo'], [x.personal, '--c-pers'], [x.fijos, '--c-fijo']];
      for (const [v, c] of partes) {
        if (v <= 0) continue;
        const dentro = Math.max(0, Math.min(v, x.venta - acc)), fuera = v - dentro;
        if (dentro > 0) s += '<rect x="' + x0 + '" y="' + y(acc + dentro) + '" width="' + w + '" height="' + Math.max(0.5, y(acc) - y(acc + dentro)) + '" fill="' + css(c) + '" opacity="' + op + '"/>';
        if (fuera > 0) s += '<rect x="' + x0 + '" y="' + y(acc + dentro + fuera) + '" width="' + w + '" height="' + Math.max(0.5, y(acc + dentro) - y(acc + dentro + fuera)) + '" fill="url(#rayas)" opacity="' + op + '"/>';
        acc += v;
      }
      if (x.queda > 0) s += '<rect x="' + x0 + '" y="' + y(x.venta) + '" width="' + w + '" height="' + Math.max(0.5, y(x.venta - x.queda) - y(x.venta)) + '" fill="' + css('--c-queda') + '" opacity="' + op + '"/>';
      if (sel) s += '<rect x="' + (x0 - 1) + '" y="' + y(Math.max(x.venta, acc)) + '" width="' + (w + 2) + '" height="' + Math.max(1, y(0) - y(Math.max(x.venta, acc))) + '" fill="none" stroke="' + css('--txt') + '" stroke-width="2" rx="' + rx + '"/>';
    } else {
      const v = val(x), t = y(Math.max(0, v)), b = y(Math.min(0, v));
      const ok = x.queda >= 0 || (x.venta <= 0 && x.personal <= 0);
      const c = met === 'queda' ? (v < 0 ? css('--c-bad') : css('--c-queda')) : (ok ? css(met === 'venta' ? '--c-venta' : '--c-margen') : css('--c-bad'));
      s += '<rect x="' + x0 + '" y="' + t + '" width="' + w + '" height="' + Math.max(1, b - t) + '" rx="' + rx + '" fill="' + c + '" opacity="' + (sel ? 1 : .75) + '"' + (sel ? ' stroke="' + css('--txt') + '" stroke-width="2"' : '') + '/>';
    }
    s += '</g>';
    if (i === iMax && vals[i] > 0) s += '<text x="' + (x0 + w / 2) + '" y="' + (y(topDe(x)) - 6) + '" text-anchor="middle" font-size="12" font-weight="900" fill="' + css('--txt') + '">★ ' + kS(vals[i]) + '</text>';
    if (i % paso === 0 || i === D.length - 1) s += '<text x="' + (x0 + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + css('--mut') + '">' + fmtDia(x.dia, true) + '</text>';
  });
  // líneas: promedio (punteada) y equilibrio (naranja); etiquetas sin pisarse
  const yp = prom ? y(prom) : null, ye = eq != null ? y(eq) : null;
  if (yp != null) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yp + '" y2="' + yp + '" stroke="' + css('--txt') + '" stroke-width="1.5" stroke-dasharray="6 5" opacity=".6"/>';
  if (ye != null) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ye + '" y2="' + ye + '" stroke="' + css('--c-fijo') + '" stroke-width="3"/>';
  const lbl = (yy, txt, col, anchor, x) => '<text x="' + x + '" y="' + (yy - 6) + '" text-anchor="' + anchor + '" font-size="12.5" font-weight="900" fill="' + css(col) + '" stroke="' + css('--panel') + '" stroke-width="4" paint-order="stroke">' + txt + '</text>';
  if (yp != null) s += lbl(yp, 'promedio ' + kS(prom), '--txt', 'end', W - pr);
  if (ye != null) s += lbl(ye + (yp != null && Math.abs(ye - yp) < 16 && ye > yp ? 20 : 0), (met === 'queda' ? 'equilibrio (0)' : met === 'utilidad' ? 'equilibrio: ' + kS(eq) + ' de margen/día' : 'equilibrio: vender ' + kS(eq) + '/día'), '--c-fijo', 'start', pl + 6);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('height', H); svg.innerHTML = s;
  // resumen
  const nOp = dOp.length;
  $('diaRes').innerHTML = (eqVenta == null ? 'Sin margen en el periodo: no se puede calcular el equilibrio.'
    : (cubrio === nOp ? '✅' : cubrio >= nOp / 2 ? '⚠️' : '❌') + ' <b>' + cubrio + ' de ' + nOp + ' días</b> cubrieron sus costos. Para no perder, hay que vender al menos <b style="color:var(--c-fijo)">' + S0(eqVenta) + ' al día</b>'
      + ' <span class="mut">(personal ≈ ' + S0(costoDia - cfd) + '/día' + (cfd ? ' + costos fijos ' + S0(cfd) + '/día' : '') + ', con un margen de ' + P1(mRatio * 100) + (st.zona === 'TODAS' && st.data.almacen && +st.data.almacen.total ? '; sin almacén' : '') + ')</span>.'
      + (prom && met !== 'queda' && met !== 'utilidad' ? ' Hoy vendemos en promedio <b>' + S0(prom) + '</b>: ' + (prom >= eqVenta * 1.95 ? '<b class="m-ok">' + (prom / eqVenta).toFixed(1).replace('.', ',') + ' veces el equilibrio</b>.' : prom >= eqVenta ? '<b class="m-ok">' + P1((prom / eqVenta - 1) * 100) + ' por encima</b>.' : '<b class="m-bad">' + P1((1 - prom / eqVenta) * 100) + ' por debajo</b>.') : ''))
    + (cfd ? '' : ' <a href="#" onclick="abrirCF();return false" style="color:var(--acc);font-weight:800">Agrega los costos fijos</a> para un equilibrio real.');
  // detalle del día
  const x = D[st.diaSel];
  const opero = x.venta > 0 || x.personal > 0;
  let det = '<b>' + fmtDia(x.dia) + '</b>: vendimos <b>' + S0(x.venta) + '</b>';
  if (opero) det += x.queda >= 0
    ? ' — <b class="m-ok">✅ cubrió sus costos</b> y dejó <b>' + S0(x.queda) + '</b> neto.'
    : ' — <b class="m-bad">❌ no cubrió sus costos</b>: faltaron ' + S0(-x.queda) + (mRatio > 0 ? ' (≈ ' + S0(-x.queda / mRatio) + ' más de venta)' : '') + '.';
  det += '<br><span class="mut">Mercadería ' + S0(x.merc) + ' · margen ' + S0(x.utilidad) + ' · personal ' + S0(x.personal) + (x.fijos ? ' · costos fijos ' + S0(x.fijos) : '') + '</span>';
  $('diaTxt').innerHTML = det;
  svg.querySelectorAll('.db').forEach(b => b.addEventListener('click', () => { st.diaSel = +b.dataset.i; pintarDias(); }));
  // leyenda según la vista
  let lg = $('diaLeg'); if (!lg) { lg = document.createElement('div'); lg.id = 'diaLeg'; lg.className = 'leyenda'; $('diaTxt').before(lg); }
  lg.innerHTML = (met === 'todo'
    ? '<span><i style="background:var(--c-costo)"></i>Mercadería</span><span><i style="background:var(--c-pers)"></i>Personal</span>' + (cfd ? '<span><i style="background:var(--c-fijo)"></i>Costos fijos</span>' : '') + '<span><i style="background:var(--c-queda)"></i>Neto</span><span><i style="background:repeating-linear-gradient(45deg,var(--c-bad) 0 3px,var(--bad-bg) 3px 6px)"></i>Faltó</span>'
    : met === 'queda' ? '<span><i style="background:var(--c-queda)"></i>Quedó</span><span><i style="background:var(--c-bad)"></i>Faltó</span>'
    : '<span><i style="background:var(' + (met === 'venta' ? '--c-venta' : '--c-margen') + ')"></i>Cubrió sus costos</span><span><i style="background:var(--c-bad)"></i>No cubrió</span>')
    + '<span><i style="background:var(--c-fijo);height:4px;vertical-align:3px"></i>Equilibrio</span><span><i style="background:none;border-top:2px dashed var(--txt);border-radius:0;height:0;vertical-align:3px"></i>Promedio</span>';
}

// ── 3. MARGEN ──────────────────────────────────────────────
function pintarMargen() {
  const L = (st.data.padres || []).filter(p => +p.venta > 0);
  const utiTot = L.reduce((a, p) => a + Math.max(0, +p.utilidad), 0);
  const ord = L.slice().sort((a, b) => b.utilidad - a.utilidad);
  let acc = 0, k = 0; for (const p of ord) { if (acc >= utiTot * 0.8) break; acc += Math.max(0, +p.utilidad); k++; }
  $('pareto').innerHTML = utiTot > 0
    ? '🎯 <b>' + k + '</b> de ' + L.length + ' productos (' + pct(k, L.length).toFixed(0) + '%) generan el <b>80% del margen</b>. Esos son los que nunca deben faltar en la tienda.'
    : 'Sin margen en este periodo.';
  let M, val, txt;
  if (st.mgModo === 'poco') {
    const topV = L.filter(p => p.origen !== 'EST' && p.origen !== 'DUDOSO').sort((a, b) => b.venta - a.venta).slice(0, 40);
    M = topV.sort((a, b) => pct(a.utilidad, a.venta) - pct(b.utilidad, b.venta)).slice(0, 10);
    val = p => +p.venta; txt = p => S0(p.venta) + ' vendidos · margen ' + P1(pct(p.utilidad, p.venta));
  } else if (st.mgModo === 'pct') {
    M = L.filter(p => p.venta >= 50 && p.origen !== 'EST').sort((a, b) => pct(b.utilidad, b.venta) - pct(a.utilidad, a.venta)).slice(0, 10);
    val = p => pct(p.utilidad, p.venta); txt = p => P1(pct(p.utilidad, p.venta)) + ' · ' + S0(p.utilidad) + ' de margen';
  } else {
    M = ord.slice(0, 10); val = p => +p.utilidad; txt = p => S0(p.utilidad) + ' · ' + P1(pct(p.utilidad, p.venta));
  }
  const mx = Math.max(1, ...M.map(val));
  const colFn = p => { const m = pct(p.utilidad, p.venta); return m < 0 ? '--c-bad' : m < 15 ? '--c-warn' : '--c-margen'; };
  $('hbMg').innerHTML = M.length ? M.map(p => '<div class="n" title="' + esc(p.nombre) + '">' + esc(p.nombre) + '</div><div class="b"><i style="width:' + Math.max(2, val(p) / mx * 100).toFixed(1) + '%;background:var(' + colFn(p) + ');opacity:.28"></i><span>' + txt(p) + (p.origen === 'EST' ? ' <span class="chip c-est">est.</span>' : p.origen === 'DUDOSO' ? ' <span class="chip c-bad">dudoso</span>' : '') + '</span></div>').join('')
    : '<div class="mut">Sin datos suficientes.</div>';
}

// ── 4. SIMULADOR DE COMISIÓN ───────────────────────────────
const PRESETS = [
  { t: 'Solo comisión 3% venta', modo: 'comision', base: 'venta', fijo: 0, pct: 3 },
  { t: 'S/ 20 + 2% venta', modo: 'mixto', base: 'venta', fijo: 20, pct: 2 },
  { t: 'S/ 30 + 1% venta', modo: 'mixto', base: 'venta', fijo: 30, pct: 1 },
  { t: 'S/ 20 + 10% utilidad', modo: 'mixto', base: 'utilidad', fijo: 20, pct: 10 },
  { t: 'Mínimo S/ 40 o 3% venta', modo: 'garantizado', base: 'venta', fijo: 40, pct: 3 }
];
const PMAX = { venta: 20, utilidad: 80 }, PSTEP = { venta: 0.1, utilidad: 0.5 };
function simHTML() {
  const S_ = st.sim;

  t += '<li>Hoy el pago de estas personas equivale al <b>' + P1(pct(pagoV, ventaV || 1)) + ' de lo que venden</b>. Ese es el punto de partida: una comisión menor a eso, sobre la venta, te ahorra dinero.</li>';
  if (sinVentas.length) t += '<li><b>' + sinVentas.length + ' persona(s)</b> cobraron <b>' + S0(pagoSinVentas) + '</b> sin ventas registradas a su nombre (' + sinVentas.map(x => esc(x.nombre)).join(', ') + '). Con comisión dejarían de cobrar eso: revisa si cumplen otra función (apoyo, reposición) antes de decidir.</li>';
  t += '<li>Hoy solo el <b>' + conCosto.toFixed(0) + '%</b> de lo vendido tiene costo registrado. ' + (conCosto < 85 ? 'Por eso, <b>comisionar sobre la ganancia todavía no es confiable</b>: la ganancia de muchos productos es estimada.' : 'Los costos ya son bastante confiables como para comisionar sobre la ganancia.') + '</li>';
  t += '<li>Recomendación para empezar: <b>fijo pequeño + % sobre la venta</b> (por ejemplo S/ 20 + 2%). Protege al vendedor en días flojos y premia al que vende más. Cuando los costos estén completos, se puede pasar a % sobre la ganancia.</li></ul>';
  $('simReco').innerHTML = t;
}
function simChart() {
  const svg = $('cSim'); if (!svg || !st._simRef) return;
  const S_ = st.sim, pmax = PMAX[S_.base], pc = S_.pct[S_.base];
  const W = Math.max(300, svg.clientWidth || 600), H = W < 560 ? 210 : 240, pl = 48, pr = 12, pt = 18, pb = 30;
  const N = 40, pts = []; for (let i = 0; i <= N; i++) { const p = pmax * i / N; pts.push([p, simEscenario(p).sim]); }
  const { hoy, quedaHoy, pTope } = st._simRef, tope = hoy + quedaHoy;
  const ymax = niceMax(Math.max(hoy * 1.3, ...pts.map(p => p[1]), 1));
  const x = p => pl + (W - pl - pr) * p / pmax, y = v => pt + (H - pt - pb) * (1 - Math.min(v, ymax) / ymax);
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + css('--line') + '"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="' + css('--dim') + '">' + kS(v) + '</text>'; }
  for (let i = 0; i <= 5; i++) { const p = pmax * i / 5; s += '<text x="' + x(p) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="' + css('--mut') + '">' + (Math.round(p * 10) / 10) + '%</text>'; }
  // zonas ahorro / gasto bajo la curva
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  s += '<path d="' + path + ' L ' + x(pmax) + ' ' + y(0) + ' L ' + x(0) + ' ' + y(0) + ' Z" fill="' + css('--c-pers') + '" opacity=".10"/>';
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(hoy) + '" y2="' + y(hoy) + '" stroke="' + css('--txt') + '" stroke-width="2" stroke-dasharray="7 5"/><text x="' + (pl + 6) + '" y="' + (y(hoy) - 6) + '" font-size="12" font-weight="800" fill="' + css('--txt') + '">hoy ' + kS(hoy) + '</text>';
  if (tope <= ymax) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(tope) + '" y2="' + y(tope) + '" stroke="' + css('--c-bad') + '" stroke-width="2"/><text x="' + (W - pr - 4) + '" y="' + (y(tope) - 6) + '" text-anchor="end" font-size="12" font-weight="800" fill="' + css('--c-bad') + '">tope ' + kS(tope) + '</text>';
  s += '<path d="' + path + '" fill="none" stroke="' + css('--c-pers') + '" stroke-width="3.5" stroke-linejoin="round"/>';
  const yc = simEscenario(pc).sim, cx = x(Math.min(pc, pmax));
  s += '<line x1="' + cx + '" x2="' + cx + '" y1="' + pt + '" y2="' + (H - pb) + '" stroke="' + css('--c-pers') + '" stroke-dasharray="3 4"/>'
    + '<circle cx="' + cx + '" cy="' + y(yc) + '" r="8" fill="' + css(yc <= hoy ? '--c-queda' : '--c-bad') + '" stroke="' + css('--panel') + '" stroke-width="3"/>'
    + '<text x="' + Math.min(W - pr - 50, Math.max(pl + 50, cx)) + '" y="' + Math.max(pt + 12, y(yc) - 14) + '" text-anchor="middle" font-size="13" font-weight="900" fill="' + css('--txt') + '">' + P1(pc) + ' → ' + kS(yc) + '</text>';
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('height', H); svg.innerHTML = s;
  st._simGeo = { W, pl, pr, pmax };
}

// ── 5. PRODUCTOS ───────────────────────────────────────────
function verDudosos() {
  st.orden = 'margen'; st.q = ''; st.verTodos = true;
  (st.data.padres || []).forEach(p => { if (p.origen === 'DUDOSO') st.abiertos.add(p.cod); });
  const b = $('busca'); if (b) b.value = '';
  marcar('fOrden', st.orden);
  st.soloDudosos = true; pintarProductos(); st.soloDudosos = false;
  $('cardProd').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function pintarProductos() {
  const tb = $('tbProd'); if (!tb) return;
  const q = st.q.trim().toLowerCase();
  let L = (st.data.padres || []).filter(p => !st.soloDudosos || p.origen === 'DUDOSO').filter(p => !q || (p.nombre || '').toLowerCase().includes(q) || (p.hijos || []).some(h => (h.nombre || '').toLowerCase().includes(q)));
  const mg = p => pct(+p.utilidad, +p.venta);
  if (st.orden === 'utilidad') L = L.slice().sort((a, b) => b.utilidad - a.utilidad);
  else if (st.orden === 'margen') L = L.slice().sort((a, b) => mg(a) - mg(b) || b.venta - a.venta);
  else L = L.slice().sort((a, b) => b.venta - a.venta);
  const tope = st.verTodos || q ? L.length : 30;
  let h = '';
  for (const p of L.slice(0, tope)) {
    const hijos = p.hijos || [];
    const unico = hijos.length === 1 && hijos[0].cod === p.cod;
    const ab = st.abiertos.has(p.cod);
    const m = mg(p);
    h += '<tr class="padre' + (ab ? ' ab' : '') + '" data-c="' + esc(p.cod) + '"><td><span class="tg">' + (unico ? '' : '▸') + '</span>' + esc(p.nombre)
      + (unico ? '' : ' <span class="mut" style="font-weight:400">· ' + hijos.length + ' present.</span>') + chipOrigen(p.origen) + '</td>'
      + '<td class="num">' + qty(p.cantBase, false, p.um) + '</td>'
      + '<td class="hide-m mut num">' + (unico ? S(hijos[0].precio) : '') + '</td>'
      + '<td class="hide-m num">' + S(p.costo) + '</td><td class="num"><b>' + S(p.venta) + '</b></td><td class="hide-m num">' + S(p.utilidad) + '</td><td class="' + mClase(m) + '">' + m.toFixed(0) + '%</td></tr>';
    if (ab && !unico) {
      for (const x of hijos) {
        const mh = pct(+x.utilidad, +x.venta);
        h += '<tr class="hijo"><td>' + esc(x.nombre) + chipOrigen(x.origen) + '</td><td class="num">' + qty(x.cant, x.peso, x.peso ? 'KGM' : '') + '</td>'
          + '<td class="hide-m num">' + S(x.precio) + '</td><td class="hide-m num" title="Costo unitario ' + S(x.costoUnit) + '">' + S(x.costo) + '</td>'
          + '<td class="num">' + S(x.venta) + '</td><td class="hide-m num">' + S(x.utilidad) + '</td><td class="' + mClase(mh) + '">' + mh.toFixed(0) + '%</td></tr>';
      }
    }
  }
  if (!L.length) h = '<tr><td colspan="7" class="mut" style="text-align:center;padding:20px">' + (q ? 'Ningún producto coincide con la búsqueda.' : 'Sin ventas en este periodo.') + '</td></tr>';
  tb.innerHTML = h;
  $('masProd').innerHTML = L.length > tope ? '<button class="btn mas" onclick="st.verTodos=true;pintarProductos()">Ver los ' + L.length + ' productos</button>' : '';
}

// ── MODAL COSTOS FIJOS ─────────────────────────────────────
function cfCtx() { const c = LS('mos_reporte_ctx'); return c && c.u ? c : null; }
function abrirCF() {
  const zonas = ['ZONA-01', 'ZONA-02', 'GENERAL'];
  st.cfZona = st.zona !== 'TODAS' ? st.zona : (st.cfZona || 'ZONA-01');
  st.cfEdit = {}; zonas.forEach(z => st.cfEdit[z] = (st.cf || []).filter(it => it.zona === z).map(it => ({ ...it })));
  let ov = $('cfModal'); if (ov) ov.remove();
  ov = document.createElement('div'); ov.id = 'cfModal'; ov.className = 'cf-ov';
  ov.innerHTML = '<div class="cf-pn" role="dialog" aria-modal="true" aria-label="Costos fijos"><div class="cf-hd"><h2>🏠 Costos fijos del local</h2>'
    + '<div class="sub" style="margin:0 0 8px">Pon cuánto pagas y cada cuánto. El reporte lo reparte solo por día, semana o 4 semanas.</div>'
    + '<div class="seg sm" id="cfZonas">' + zonas.map(z => '<button data-v="' + z + '">' + ZN(z) + '</button>').join('') + '</div></div>'
    + '<div class="cf-bd"><div class="mut" style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em">Agregar rápido</div>'
    + '<div class="cf-pre" id="cfPre">' + CF_PRE.map(x => '<button data-c="' + esc(x[0]) + '">' + x[1] + ' ' + esc(x[0]) + '</button>').join('') + '<button data-c="">＋ Otro</button></div>'
    + '<div id="cfRows"></div><div id="cfMsg"></div></div>'
    + '<div class="cf-ft"><div class="cf-sum" id="cfSum"></div><button class="btn" id="cfCancel">Cancelar</button><button class="btn cf" id="cfSave">Guardar</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) cerrarCF(); });
  $('cfCancel').addEventListener('click', cerrarCF);
  $('cfZonas').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.cfZona = b.dataset.v; cfPintar(); });
  $('cfPre').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    st.cfEdit[st.cfZona].push({ concepto: b.dataset.c, monto: '', frecuencia: 'MES' }); cfPintar();
    const rows = document.querySelectorAll('#cfRows .cf-row'); const last = rows[rows.length - 1];
    if (last) (b.dataset.c ? last.querySelector('.m') : last.querySelector('.c')).focus(); });
  $('cfSave').addEventListener('click', guardarCF);
  document.addEventListener('keydown', cfEsc);
  cfPintar();
}
function cfEsc(e) { if (e.key === 'Escape') cerrarCF(); }
function cerrarCF() { const ov = $('cfModal'); if (ov) ov.remove(); document.removeEventListener('keydown', cfEsc); }
function cfPintar() {
  marcar('cfZonas', st.cfZona);
  const L = st.cfEdit[st.cfZona];
  $('cfRows').innerHTML = L.length ? L.map((it, i) => '<div class="cf-row" data-i="' + i + '">'
      + '<input class="c" list="cfList" placeholder="Concepto (ej. Alquiler)" value="' + esc(it.concepto) + '" maxlength="60">'
      + '<input class="m num" type="number" inputmode="decimal" min="0" step="0.01" placeholder="S/ 0.00" value="' + (it.monto === '' ? '' : +it.monto) + '">'
      + '<select class="f">' + Object.keys(CF_FREQ).map(k => '<option value="' + k + '"' + (it.frecuencia === k ? ' selected' : '') + '>' + CF_FREQ[k] + '</option>').join('') + '</select>'
      + '<button class="cf-del" title="Quitar">🗑</button></div>').join('')
    + '<datalist id="cfList">' + CF_PRE.map(x => '<option value="' + esc(x[0]) + '">').join('') + '</datalist>'
    : '<div class="mut" style="padding:14px 0;text-align:center">Sin costos fijos en ' + ZN(st.cfZona) + '. Toca una opción de arriba para agregar.</div>';
  $('cfRows').querySelectorAll('.cf-row').forEach(row => {
    const i = +row.dataset.i, it = L[i];
    row.querySelector('.c').addEventListener('input', e => { it.concepto = e.target.value; });
    row.querySelector('.m').addEventListener('input', e => { it.monto = e.target.value; cfResumen(); });
    row.querySelector('.f').addEventListener('change', e => { it.frecuencia = e.target.value; cfResumen(); });
    row.querySelector('.cf-del').addEventListener('click', () => { L.splice(i, 1); cfPintar(); });
  });
  const ctx = cfCtx();
  $('cfMsg').innerHTML = ctx ? '' : '<div class="cf-msg" style="background:var(--warn-bg);color:var(--warn-tx)">Para guardar, abre este reporte desde MOS (Finanzas → Reporte zonas) con tu sesión de admin o master.</div>';
  cfResumen();
}
function cfResumen() {
  const L = st.cfEdit[st.cfZona].filter(it => +it.monto > 0);
  const dia = L.reduce((a, it) => a + cfPorDia(it), 0);
  $('cfSum').innerHTML = L.length ? ZN(st.cfZona) + ': <b>' + S0(dia * 365 / 12) + ' al mes</b><br><span class="mut">= ' + S(dia) + ' por día · ' + S0(dia * 7) + ' por semana · ' + S0(dia * 28) + ' en 4 semanas</span>' : '<span class="mut">Sin montos todavía.</span>';
}
async function guardarCF() {
  const ctx = cfCtx(); const msg = $('cfMsg');
  if (!ctx) { msg.innerHTML = '<div class="cf-msg" style="background:var(--bad-bg);color:var(--bad-tx)">No sé quién eres: abre el reporte desde MOS con tu sesión.</div>'; return; }
  const zonasCambiadas = Object.keys(st.cfEdit).filter(z => {
    const a = JSON.stringify((st.cf || []).filter(it => it.zona === z).map(it => [it.concepto, +it.monto, it.frecuencia]));
    const b = JSON.stringify(st.cfEdit[z].filter(it => String(it.concepto).trim() && +it.monto > 0).map(it => [String(it.concepto).trim(), Math.round(+it.monto * 100) / 100, it.frecuencia]));
    return a !== b;
  });
  const malos = st.cfEdit[st.cfZona].filter(it => (String(it.concepto).trim() && !(+it.monto > 0)) || (!String(it.concepto).trim() && +it.monto > 0));
  if (malos.length) { msg.innerHTML = '<div class="cf-msg" style="background:var(--warn-bg);color:var(--warn-tx)">Completa el concepto y el monto de cada fila (o quítala con 🗑).</div>'; return; }
  if (!zonasCambiadas.length) { cerrarCF(); return; }
  const btn = $('cfSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    for (const z of zonasCambiadas) {
      const items = st.cfEdit[z].filter(it => String(it.concepto).trim() && +it.monto > 0).map(it => ({ id: it.id || null, concepto: String(it.concepto).trim(), monto: Math.round(+it.monto * 100) / 100, frecuencia: it.frecuencia }));
      const j = await rpc('costos_fijos_guardar', { usuario: ctx.u, zona: z, items });
      if (!j || !j.ok) throw new Error((j && j.error) || 'ERROR');
    }
    await cargarCF(); cerrarCF(); if (st.data) pintar();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Guardar';
    msg.innerHTML = '<div class="cf-msg" style="background:var(--bad-bg);color:var(--bad-tx)">' + (e.message === 'ROL_NO_AUTORIZADO' ? 'Solo admin o master pueden guardar costos fijos (' + esc(ctx.u) + ' no tiene permiso).' : 'No se pudo guardar. Revisa la conexión e intenta otra vez.') + '</div>';
  }
}

// ── eventos ────────────────────────────────────────────────
function marcar(id, v) { const el = $(id); if (el) el.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(b.dataset.v) === String(v))); }
function guardarFiltros() { LS('mos_reporte_zonas_filtros', { zona: st.zona, dias: st.dias }); }
$('fZona').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.v === st.zona) return; st.zona = b.dataset.v; marcar('fZona', st.zona); guardarFiltros(); st.abiertos.clear(); st.verTodos = false; cargar(); });
$('fDias').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || +b.dataset.v === st.dias) return; st.dias = +b.dataset.v; marcar('fDias', st.dias); guardarFiltros(); st.abiertos.clear(); st.verTodos = false; cargar(); });
$('btnAct').addEventListener('click', () => cargar(true));
$('btnCF').addEventListener('click', () => abrirCF());
function temaIcono() { $('btnTema').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
$('btnTema').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; LS('mos_reporte_zonas_tema', t); temaIcono();
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#020817' : '#f4f6fb';
  if (st.data) pintarGraficos();
});
$('btnFull').addEventListener('click', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (_) {} });
$('cuerpo').addEventListener('click', e => {
  const tr = e.target.closest('tr.padre'); if (!tr) return;
  const c = tr.dataset.c; st.abiertos.has(c) ? st.abiertos.delete(c) : st.abiertos.add(c); pintarProductos();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (st.data) pintarGraficos(); }, 150); });
temaIcono(); marcar('fZona', st.zona); marcar('fDias', st.dias);
cargar();
</script>
