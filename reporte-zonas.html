<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<title>Reporte de zonas · MOS</title>
<style>
:root{
  --bg:#020817; --panel:#0b1324; --panel2:#0f1a30; --line:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --dim:#64748b;
  --gold:#fbbf24; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --blue:#60a5fa;
  --c-costo:#64748b; --c-pers:#a78bfa; --c-queda:#22c55e;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.02em;flex:1;min-width:180px}
.top .gen{font-size:12px;color:var(--mut)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;min-height:40px}
.btn:active{transform:scale(.97)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:700;color:var(--mut);min-height:40px}
.seg button.on{background:var(--gold);color:#1a1200}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.queda{border-color:rgba(34,197,94,.45);background:linear-gradient(160deg,rgba(34,197,94,.12),var(--panel))}
.kpi.queda.neg{border-color:rgba(239,68,68,.5);background:linear-gradient(160deg,rgba(239,68,68,.14),var(--panel))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:15px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.frase{font-size:16px;margin:2px 0 12px}
.frase b{font-size:18px}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;background:#111827}
.split div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mut)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.avisos{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.aviso{font-size:12.5px;padding:8px 12px;border-radius:10px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);color:#cbd5e1}
.aviso.amb{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
#chartDias{width:100%;display:block}
.tbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tbar input{flex:1 1 100%;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font:inherit;min-height:40px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr.padre{cursor:pointer}
tr.padre:hover td{background:rgba(255,255,255,.03)}
tr.padre td:first-child{font-weight:700}
.tg{display:inline-block;width:16px;color:var(--mut);transition:transform .15s}
tr.padre.ab .tg{transform:rotate(90deg)}
tr.hijo td{font-size:13px;background:rgba(15,26,48,.55);color:#cbd5e1}
tr.hijo td:first-child{padding-left:30px}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.c-real{background:rgba(34,197,94,.14);color:#4ade80}
.c-padre{background:rgba(96,165,250,.14);color:#93c5fd}
.c-bad{background:rgba(239,68,68,.16);color:#fca5a5}
.c-est{background:rgba(245,158,11,.14);color:#fbbf24}
.m-ok{color:#4ade80;font-weight:800}.m-mid{color:#fbbf24;font-weight:800}.m-bad{color:#f87171;font-weight:800}
.mut{color:var(--mut)}
.mas{width:100%;margin-top:10px}
.tot td{font-weight:800;border-top:2px solid rgba(251,191,36,.35);border-bottom:0;color:#fef3c7}
.pill{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
.p-pag{background:rgba(34,197,94,.14);color:#4ade80}.p-pen{background:rgba(245,158,11,.14);color:#fbbf24}
.estado{padding:40px 10px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 10px;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.scroll{overflow-x:auto}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:20px}
  .hide-m{display:none}
  th,td{padding:8px 5px}
  table{font-size:12.5px} tr.hijo td{font-size:12px}
  tr.padre td:first-child,tr.hijo td:first-child{min-width:118px}
  th{font-size:10px}
  tr.hijo td:first-child{padding-left:16px}
  .chip{margin-left:0;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📋 Reporte de zonas</h1>
    <span class="gen" id="gen"></span>
    <button class="btn" id="btnAct" title="Volver a consultar la base">↻ Actualizar</button>
  </div>

  <div class="filtros">
    <div class="seg" id="fZona">
      <button data-v="TODAS">Todas</button>
      <button data-v="ZONA-01">Zona 01</button>
      <button data-v="ZONA-02">Zona 02</button>
    </div>
    <div class="seg" id="fDias">
      <button data-v="1">Hoy</button>
      <button data-v="7">7 días</button>
      <button data-v="28">4 semanas</button>
    </div>
  </div>

  <div id="cuerpo"><div class="estado"><div class="spin"></div>Cargando…</div></div>
</div>

<script>
'use strict';
const SB_URL  = 'https://rzbzdeipbtqkzjqdchqk.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6YnpkZWlwYnRxa3pqcWRjaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzYwMDQsImV4cCI6MjA5NjQ1MjAwNH0.MAlSdz_ugGUZoaU5st6dA_gb_x_IiUL0TXxH176kY9k';

const st = { zona: 'TODAS', dias: 1, data: null, abiertos: new Set(), q: '', orden: 'venta', verTodos: false };
const cache = {};
let tok = null;
try { const g = JSON.parse(localStorage.getItem('mos_reporte_zonas_filtros') || 'null'); if (g) { st.zona = g.zona || st.zona; st.dias = g.dias || st.dias; } } catch (_) {}

// ── utilidades ─────────────────────────────────────────────
const nf2 = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 0 });
const S  = n => 'S/ ' + nf2.format(Number(n) || 0);
const S0 = n => 'S/ ' + nf0.format(Number(n) || 0);
const pct = (a, b) => b ? (a / b * 100) : 0;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function qty(n, peso, um) {
  n = Number(n) || 0;
  if (peso || /^(KGM|KG)$/i.test(um || '')) return (n < 1 && n > 0 ? nf0.format(n * 1000) + ' g' : (Math.round(n * 1000) / 1000).toLocaleString('es-PE') + ' kg');
  if (/^(LTR|L)$/i.test(um || '')) return (Math.round(n * 1000) / 1000).toLocaleString('es-PE') + ' L';
  return (Math.round(n * 100) / 100).toLocaleString('es-PE') + ' und';
}
function mClase(m) { return m < 0 ? 'm-bad' : (m < 15 ? 'm-mid' : 'm-ok'); }
function chipOrigen(o) {
  if (o === 'REAL') return '<span class="chip c-real" title="Costo registrado en el catálogo">costo real</span>';
  if (o === 'PADRE') return '<span class="chip c-padre" title="Costo del padre × su fracción (ej. ½ kg = mitad del costo del kilo)">del padre</span>';
  if (o === 'DUDOSO') return '<span class="chip c-bad" title="El costo del catálogo es igual o mayor que el precio de venta: parece mal cargado. Se usó el 15%. Corrígelo en el catálogo.">costo dudoso</span>';
  if (o === 'MIXTO') return '<span class="chip c-est" title="Una parte con costo y otra estimada al 15%">parcial</span>';
  return '<span class="chip c-est" title="Sin costo registrado: se asume margen de 15%">est. 15%</span>';
}
function fmtDia(d, corto) {
  const f = new Date(d + 'T12:00:00');
  return f.toLocaleDateString('es-PE', corto ? { day: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'short' });
}
function fetchTO(url, opts, ms) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 20000);
  return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t));
}

// ── datos ──────────────────────────────────────────────────
async function token() {
  if (tok && tok.exp > Date.now() / 1000 + 60) return tok.t;
  let dev = '';
  try { dev = localStorage.getItem('mos_device_id') || ''; } catch (_) {}
  if (!dev) throw new Error('SIN_DISPOSITIVO');
  const r = await fetchTO(SB_URL + '/functions/v1/mint-mos', {
    method: 'POST', headers: { apikey: SB_ANON, 'Content-Type': 'application/json' }, cache: 'no-store',
    body: JSON.stringify({ deviceId: dev })
  }, 9000);
  const d = await r.json().catch(() => null);
  if (!d || !d.ok || !d.token) throw new Error('SIN_PERMISO');
  tok = { t: d.token, exp: d.exp || (Date.now() / 1000 + 1500) };
  return tok.t;
}
async function cargar(force) {
  const k = st.zona + '|' + st.dias;
  if (!force && cache[k] && Date.now() - cache[k].ts < 5 * 60 * 1000) { st.data = cache[k].d; pintar(); return; }
  document.getElementById('cuerpo').innerHTML = '<div class="estado"><div class="spin"></div>Calculando ' + (st.dias === 1 ? 'hoy' : 'los últimos ' + st.dias + ' días') + '…</div>';
  try {
    let d = null;
    for (let i = 0; i < 2 && !d; i++) {
      try {
        const t = await token();
        const r = await fetchTO(SB_URL + '/rest/v1/rpc/reporte_zona_productos', {
          method: 'POST',
          headers: { apikey: SB_ANON, Authorization: 'Bearer ' + t, 'Content-Profile': 'mos', 'Accept-Profile': 'mos', 'Content-Type': 'application/json' },
          body: JSON.stringify({ p: { zona: st.zona, dias: st.dias } })
        }, 30000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (!j || !j.ok) throw new Error((j && j.error) || 'RESPUESTA');
        d = j;
      } catch (e) { if (e.message === 'SIN_DISPOSITIVO' || i === 1) throw e; tok = null; await new Promise(r => setTimeout(r, 700)); }
    }
    cache[k] = { d, ts: Date.now() };
    if (k !== st.zona + '|' + st.dias) return;
    st.data = d; pintar();
  } catch (e) {
    const msg = e.message === 'SIN_DISPOSITIVO'
      ? 'Abre este reporte desde MOS (Finanzas → Reporte de zonas) en un equipo autorizado.'
      : e.message === 'SIN_PERMISO' ? 'Este equipo no está autorizado en MOS.'
      : 'No se pudo cargar el reporte. Revisa la conexión y vuelve a intentar.';
    document.getElementById('cuerpo').innerHTML = '<div class="estado">⚠ ' + esc(msg) + '<br><br><button class="btn" onclick="cargar(true)">Reintentar</button></div>';
  }
}

// ── pintar ─────────────────────────────────────────────────
function pintar() {
  const d = st.data; if (!d) return;
  const r = d.resumen || {};
  const venta = +r.venta || 0, costo = +r.costo || 0, uti = +r.utilidad || 0, pers = +r.personal || 0;
  const queda = uti - pers;
  const mPct = pct(uti, venta);
  const periodo = st.dias === 1 ? 'hoy' : (st.dias === 7 ? 'en los últimos 7 días' : 'en las últimas 4 semanas');
  const zonaTxt = st.zona === 'TODAS' ? 'las dos zonas' : st.zona.replace('ZONA-', 'Zona ');
  document.getElementById('gen').textContent = 'Actualizado ' + (d.generado || '').slice(11) + ' · ' + fmtDia(d.desde) + (d.desde !== d.hasta ? ' → ' + fmtDia(d.hasta) : '');

  let h = '';
  // KPIs
  h += '<div class="kpis">'
    + kpi('Vendimos', S0(venta), (r.tickets || 0).toLocaleString('es-PE') + ' tickets')
    + kpi('Margen', S0(uti), '<span class="' + mClase(mPct) + '">' + mPct.toFixed(1) + '%</span> de lo vendido')
    + kpi('Personal', S0(pers), pct(pers, venta).toFixed(1) + '% de lo vendido')
    + '<div class="kpi queda' + (queda < 0 ? ' neg' : '') + '"><div class="l">' + (queda < 0 ? 'Falta' : 'Queda') + '</div><div class="v">' + S0(Math.abs(queda)) + '</div><div class="s">margen − personal</div></div>'
    + '</div>';

  // Avisos
  const conCosto = pct(+r.ventaConCosto || 0, venta);
  h += '<div class="avisos">';
  if (d.cajas && d.cajas.abiertas > 0 && st.dias === 1) h += '<div class="aviso">🟢 Hoy hay ' + d.cajas.abiertas + ' caja(s) abierta(s): los números de hoy se están llenando en vivo.</div>';
  if (venta > 0 && conCosto < 99.5) h += '<div class="aviso amb">ℹ ' + conCosto.toFixed(0) + '% de lo vendido tiene costo registrado. El otro ' + (100 - conCosto).toFixed(0) + '% se calcula con el margen por defecto de 15%.</div>';
  if (+r.ventaDudosa > 0) h += '<div class="aviso amb">⚠ Hay productos con <b>costo dudoso</b> (el costo del catálogo es igual o mayor que el precio de venta, ' + S0(r.ventaDudosa) + ' vendidos). Se calcularon al 15%. <a href="#" style="color:#fbbf24" onclick="verDudosos();return false">Ver cuáles</a></div>';
  if (st.zona === 'TODAS' && d.almacen && +d.almacen.total > 0) h += '<div class="aviso">🏭 Aparte, el personal de almacén costó ' + S0(d.almacen.total) + ' (' + d.almacen.personas + ' persona(s)). No se carga a ninguna zona porque abastece a las dos.</div>';
  h += '</div>';

  // ¿A dónde va cada sol?
  if (venta > 0) {
    const pc = pct(costo, venta), pp = pct(pers, venta), pq = Math.max(0, 100 - pc - pp);
    const c100 = pc, p100 = pp, q100 = 100 - pc - pp;
    h += '<div class="card"><h2>¿A dónde va lo que vendemos?</h2><div class="sub">' + esc(zonaTxt) + ' · ' + periodo + '</div>'
      + '<div class="frase">De cada <b>S/ 100</b> vendidos: <b style="color:#cbd5e1">S/ ' + c100.toFixed(0) + '</b> es costo de la mercadería, <b style="color:#c4b5fd">S/ ' + p100.toFixed(0) + '</b> es personal y '
      + (q100 >= 0 ? 'nos <b style="color:#4ade80">quedan S/ ' + q100.toFixed(0) + '</b>.' : '<b style="color:#f87171">faltan S/ ' + Math.abs(q100).toFixed(0) + '</b>.') + '</div>'
      + '<div class="split">'
      + seg(pc, 'var(--c-costo)', 'Costo ' + pc.toFixed(0) + '%')
      + seg(pp, 'var(--c-pers)', 'Personal ' + pp.toFixed(0) + '%')
      + seg(pq, 'var(--c-queda)', 'Queda ' + pq.toFixed(0) + '%')
      + '</div><div class="leyenda"><span><i style="background:var(--c-costo)"></i>Costo de productos ' + S0(costo) + '</span><span><i style="background:var(--c-pers)"></i>Personal ' + S0(pers) + '</span><span><i style="background:var(--c-queda)"></i>Queda ' + S0(queda) + '</span></div></div>';
  }

  // Día a día
  if (st.dias > 1) {
    h += '<div class="card"><h2>Día a día</h2><div class="sub">Cada barra es lo vendido en el día, partida en costo, personal y lo que queda. Toca una barra para ver el detalle.</div>'
      + '<svg id="chartDias" role="img" aria-label="Venta diaria"></svg><div id="diaDet" class="sub" style="margin-top:8px;min-height:18px"></div>'
      + '<div class="leyenda"><span><i style="background:var(--c-costo)"></i>Costo</span><span><i style="background:var(--c-pers)"></i>Personal</span><span><i style="background:var(--c-queda)"></i>Queda</span><span><i style="background:var(--bad)"></i>No alcanzó para el personal</span></div></div>';
  }

  // Productos
  h += '<div class="card"><h2>¿Qué vendemos?</h2><div class="sub">Agrupado por producto padre. Toca un padre para ver sus presentaciones (1 kg, ½ kg, 50 g…).</div>'
    + '<div class="tbar"><input id="busca" type="search" placeholder="Buscar producto…" value="' + esc(st.q) + '">'
    + '<div class="seg" id="fOrden"><button data-v="venta">Más vendido</button><button data-v="utilidad">Más margen</button><button data-v="margen">Peor margen</button></div></div>'
    + '<div class="scroll"><table><thead><tr><th>Producto</th><th>Cantidad</th><th class="hide-m">Precio</th><th class="hide-m">Costo</th><th>Vendido</th><th class="hide-m">Margen</th><th title="Margen sobre lo vendido">%</th></tr></thead><tbody id="tbProd"></tbody></table></div>'
    + '<div id="masProd"></div></div>';

  // Personal
  const P = d.personal || [];
  h += '<div class="card"><h2>¿Cuánto cuesta el personal?</h2><div class="sub">Lo que se le paga a cada persona asignada a la zona en el periodo (sueldo + bonos − sanciones). No incluye almacén.</div>';
  if (!P.length) h += '<div class="mut">Sin personal registrado en este periodo.</div>';
  else {
    h += '<div class="scroll"><table><thead><tr><th>Persona</th><th>Rol</th>' + (st.zona === 'TODAS' ? '<th>Zona</th>' : '') + '<th>Días</th><th class="hide-m">Base</th><th class="hide-m">Bonos</th><th>Total</th></tr></thead><tbody>';
    for (const x of P) {
      h += '<tr><td>' + esc(x.nombre) + ' <span class="pill ' + (x.pendiente ? 'p-pen">por pagar' : 'p-pag">pagado') + '</span></td><td class="mut">' + esc((x.rol || '').toLowerCase()) + '</td>'
        + (st.zona === 'TODAS' ? '<td class="mut">' + esc((x.zona || '').replace('ZONA-', 'Z')) + '</td>' : '')
        + '<td>' + x.dias + '</td><td class="hide-m">' + S(x.base) + '</td><td class="hide-m">' + S(x.extras) + '</td><td><b>' + S(x.total) + '</b></td></tr>';
    }
    h += '<tr class="tot"><td>Total</td><td></td>' + (st.zona === 'TODAS' ? '<td></td>' : '') + '<td></td><td class="hide-m"></td><td class="hide-m"></td><td>' + S(pers) + '</td></tr></tbody></table></div>';
  }
  h += '</div>';

  document.getElementById('cuerpo').innerHTML = h;
  marcar('fOrden', st.orden);
  document.getElementById('busca').addEventListener('input', e => { st.q = e.target.value; st.verTodos = false; pintarProductos(); });
  document.getElementById('fOrden').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.orden = b.dataset.v; marcar('fOrden', st.orden); pintarProductos(); });
  pintarProductos();
  if (st.dias > 1) pintarDias();
}
function verDudosos() {
  st.orden = 'margen'; st.q = ''; st.verTodos = true;
  (st.data.padres || []).forEach(p => { if (p.origen === 'DUDOSO') st.abiertos.add(p.cod); });
  const b = document.getElementById('busca'); if (b) b.value = '';
  marcar('fOrden', st.orden);
  st.soloDudosos = true; pintarProductos(); st.soloDudosos = false;
  document.getElementById('tbProd').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function kpi(l, v, s) { return '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
function seg(p, col, txt) { return p > 0 ? '<div style="width:' + p.toFixed(2) + '%;background:' + col + '" title="' + esc(txt) + '">' + (p >= 9 ? esc(txt) : '') + '</div>' : ''; }

function pintarProductos() {
  const tb = document.getElementById('tbProd'); if (!tb) return;
  const q = st.q.trim().toLowerCase();
  let L = (st.data.padres || []).filter(p => !st.soloDudosos || p.origen === 'DUDOSO').filter(p => !q || (p.nombre || '').toLowerCase().includes(q) || (p.hijos || []).some(h => (h.nombre || '').toLowerCase().includes(q)));
  const mg = p => pct(+p.utilidad, +p.venta);
  if (st.orden === 'utilidad') L = L.slice().sort((a, b) => b.utilidad - a.utilidad);
  else if (st.orden === 'margen') L = L.slice().sort((a, b) => mg(a) - mg(b) || b.venta - a.venta);
  else L = L.slice().sort((a, b) => b.venta - a.venta);
  const tope = st.verTodos || q ? L.length : 30;
  let h = '';
  for (const p of L.slice(0, tope)) {
    const hijos = p.hijos || [];
    const unico = hijos.length === 1 && hijos[0].cod === p.cod;
    const ab = st.abiertos.has(p.cod);
    const m = mg(p);
    h += '<tr class="padre' + (ab ? ' ab' : '') + '" data-c="' + esc(p.cod) + '"><td><span class="tg">' + (unico ? '' : '▸') + '</span>' + esc(p.nombre)
      + (unico ? '' : ' <span class="mut" style="font-weight:400">· ' + hijos.length + ' present.</span>') + chipOrigen(p.origen) + '</td>'
      + '<td>' + qty(p.cantBase, false, p.um) + '</td>'
      + '<td class="hide-m mut">' + (unico ? S(hijos[0].precio) : '') + '</td>'
      + '<td class="hide-m">' + S(p.costo) + '</td><td><b>' + S(p.venta) + '</b></td><td class="hide-m">' + S(p.utilidad) + '</td><td class="' + mClase(m) + '">' + m.toFixed(0) + '%</td></tr>';
    if (ab && !unico) {
      for (const x of hijos) {
        const mh = pct(+x.utilidad, +x.venta);
        h += '<tr class="hijo"><td>' + esc(x.nombre) + chipOrigen(x.origen) + '</td><td>' + qty(x.cant, x.peso, x.peso ? 'KGM' : '') + '</td>'
          + '<td class="hide-m">' + S(x.precio) + '</td><td class="hide-m" title="Costo unitario ' + S(x.costoUnit) + '">' + S(x.costo) + '</td>'
          + '<td>' + S(x.venta) + '</td><td class="hide-m">' + S(x.utilidad) + '</td><td class="' + mClase(mh) + '">' + mh.toFixed(0) + '%</td></tr>';
      }
    }
  }
  if (!L.length) h = '<tr><td colspan="7" class="mut" style="text-align:center;padding:20px">' + (q ? 'Ningún producto coincide con la búsqueda.' : 'Sin ventas en este periodo.') + '</td></tr>';
  tb.innerHTML = h;
  document.getElementById('masProd').innerHTML = L.length > tope
    ? '<button class="btn mas" onclick="st.verTodos=true;pintarProductos()">Ver los ' + L.length + ' productos</button>' : '';
}

function pintarDias() {
  const svg = document.getElementById('chartDias'); if (!svg) return;
  const D = st.data.diario || [];
  const W = Math.max(300, svg.clientWidth || 600), H = W < 520 ? 190 : 230, pl = 46, pr = 6, pt = 10, pb = 24;
  const max = Math.max(1, ...D.map(x => +x.venta));
  const top = niceMax(max);
  const bw = (W - pl - pr) / D.length, gap = Math.min(6, bw * 0.22);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4, yy = y(v);
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '" stroke="#1e293b"/><text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="#64748b">' + (v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : Math.round(v)) + '</text>';
  }
  const pasoEt = Math.ceil(D.length / (W < 520 ? 7 : 14));
  D.forEach((x, i) => {
    const vta = +x.venta || 0, uti = +x.utilidad || 0, pe = +x.personal || 0;
    const costo = Math.max(0, vta - uti), queda = uti - pe;
    const x0 = pl + i * bw + gap / 2, w = bw - gap;
    let acc = 0; const partes = [];
    partes.push([costo, 'var(--c-costo)']);
    if (queda >= 0) { partes.push([pe, 'var(--c-pers)']); partes.push([queda, 'var(--c-queda)']); }
    else partes.push([Math.max(0, uti), 'var(--bad)']);
    let r = '';
    for (const [v, c] of partes) { if (v <= 0) continue; r += '<rect x="' + x0 + '" y="' + y(acc + v) + '" width="' + w + '" height="' + Math.max(0, y(acc) - y(acc + v)) + '" fill="' + c + '"/>'; acc += v; }
    g += '<g class="bar" data-i="' + i + '" style="cursor:pointer"><rect x="' + (pl + i * bw) + '" y="' + pt + '" width="' + bw + '" height="' + (H - pt - pb) + '" fill="transparent"/>' + r + '</g>';
    if (i % pasoEt === 0 || i === D.length - 1) g += '<text x="' + (x0 + w / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="#94a3b8">' + fmtDia(x.dia, true) + '</text>';
  });
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('height', H); svg.innerHTML = g;
  const det = document.getElementById('diaDet');
  const ver = i => { const x = D[i]; if (!x) return; const q = x.utilidad - x.personal;
    det.innerHTML = '<b style="color:var(--txt)">' + fmtDia(x.dia) + '</b> · vendido ' + S(x.venta) + ' · margen ' + S(x.utilidad) + ' · personal ' + S(x.personal) + ' · <span class="' + (q < 0 ? 'm-bad' : 'm-ok') + '">' + (q < 0 ? 'faltó ' : 'quedó ') + S(Math.abs(q)) + '</span>';
    svg.querySelectorAll('.bar').forEach(b => b.style.opacity = b.dataset.i == i ? '1' : '.45'); };
  svg.querySelectorAll('.bar').forEach(b => { b.addEventListener('click', () => ver(+b.dataset.i)); b.addEventListener('mouseenter', () => ver(+b.dataset.i)); });
  svg.addEventListener('mouseleave', () => svg.querySelectorAll('.bar').forEach(b => b.style.opacity = '1'));
  ver(D.length - 1); svg.querySelectorAll('.bar').forEach(b => b.style.opacity = '1');
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

// ── eventos ────────────────────────────────────────────────
function marcar(id, v) { document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', String(b.dataset.v) === String(v))); }
function guardarFiltros() { try { localStorage.setItem('mos_reporte_zonas_filtros', JSON.stringify({ zona: st.zona, dias: st.dias })); } catch (_) {} }
document.getElementById('fZona').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.v === st.zona) return; st.zona = b.dataset.v; marcar('fZona', st.zona); guardarFiltros(); st.abiertos.clear(); st.verTodos = false; cargar(); });
document.getElementById('fDias').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || +b.dataset.v === st.dias) return; st.dias = +b.dataset.v; marcar('fDias', st.dias); guardarFiltros(); st.abiertos.clear(); st.verTodos = false; cargar(); });
document.getElementById('btnAct').addEventListener('click', () => cargar(true));
document.getElementById('cuerpo').addEventListener('click', e => {
  const tr = e.target.closest('tr.padre'); if (!tr) return;
  const c = tr.dataset.c; st.abiertos.has(c) ? st.abiertos.delete(c) : st.abiertos.add(c); pintarProductos();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (st.data && st.dias > 1) pintarDias(); }, 150); });
marcar('fZona', st.zona); marcar('fDias', st.dias);
cargar();
</script>
