<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>Control de cajas · MOS</title>
<style>
:root,[data-theme=light]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2f8; --line:#d9e0ea; --txt:#0b1220; --mut:#475569; --dim:#64748b;
  --acc:#1d4ed8; --acc-t:#ffffff; --sombra:0 1px 2px rgba(15,23,42,.06),0 6px 18px -8px rgba(15,23,42,.18);
  --bad:#dc2626; --warn:#b45309; --ok:#16a34a;
  --ok-bg:#dcfce7; --ok-tx:#166534; --bad-bg:#fee2e2; --bad-tx:#991b1b; --warn-bg:#fef3c7; --warn-tx:#92400e; --info-bg:#dbeafe; --info-tx:#1e3a8a; --gris-bg:#e2e8f0; --gris-tx:#334155;
  --z1-bg:#cffafe; --z1-tx:#155e75; --z1:#0891b2; --z2-bg:#fae8ff; --z2-tx:#86198f; --z2:#c026d3;
  --m-efe:#16a34a; --m-vir:#7c3aed; --m-cre:#ea580c; --m-pc:#dc2626; --m-mix:#0891b2;
}
[data-theme=dark]{
  --bg:#020817; --panel:#0b1324; --panel2:#132036; --line:#24324a; --txt:#f1f5f9; --mut:#a3b1c6; --dim:#7c8ba1;
  --acc:#fbbf24; --acc-t:#1a1200; --sombra:none; --bad:#f87171; --warn:#fbbf24; --ok:#22c55e;
  --ok-bg:rgba(34,197,94,.16); --ok-tx:#86efac; --bad-bg:rgba(239,68,68,.16); --bad-tx:#fca5a5; --warn-bg:rgba(245,158,11,.14); --warn-tx:#fcd34d; --info-bg:rgba(96,165,250,.12); --info-tx:#bfdbfe; --gris-bg:#1e2b42; --gris-tx:#cbd5e1;
  --z1-bg:rgba(34,211,238,.16); --z1-tx:#67e8f9; --z1:#22d3ee; --z2-bg:rgba(232,121,249,.16); --z2-tx:#f0abfc; --z2:#e879f9;
  --m-efe:#22c55e; --m-vir:#a78bfa; --m-cre:#fb923c; --m-pc:#f87171; --m-mix:#22d3ee;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{padding:max(12px,env(safe-area-inset-top)) 14px 60px}
.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.top h1{margin:0;font-size:22px;flex:1;min-width:190px;letter-spacing:-.01em}
.gen{font-size:12.5px;color:var(--mut);width:100%;order:3}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;min-height:42px;box-shadow:var(--sombra)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13.5px}
.btn[disabled]{opacity:.5}
.demo{background:var(--warn-bg);color:var(--warn-tx);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:10px}
.rango{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.rango label{font-size:12.5px;color:var(--mut);font-weight:700;display:flex;gap:6px;align-items:center}
input[type=date],input[type=search],select,textarea,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;font-size:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap;box-shadow:var(--sombra)}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:700;color:var(--mut);min-height:38px}
.seg button.on{background:var(--acc);color:var(--acc-t)}
.seg.sm button{padding:6px 10px;min-height:34px;font-size:13.5px}
.sticky{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sticky .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sticky input[type=search]{flex:1;min-width:150px}
.activos{font-size:13px;color:var(--mut);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sec .lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.cajaschips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;display:flex;gap:6px;align-items:center;font-size:13px;min-height:38px}
.cc.on{outline:2px solid var(--acc);background:var(--info-bg)}
.cc .solo{border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-size:11.5px;padding:2px 6px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sombra);border-top:5px solid var(--k,var(--acc));text-align:left;display:block;width:100%}
.kpi .l{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--mut)}
.metbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--panel2);margin:6px 0}
.metbar i{display:block;height:100%}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:10px}
.leyenda b{color:var(--txt)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:700;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
.tabs .n{background:var(--gris-bg);color:var(--gris-tx);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
.tabs .n.al{background:var(--bad-bg);color:var(--bad-tx)}
.chip{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;border:1px solid transparent;white-space:nowrap}
.z1{background:var(--z1-bg);color:var(--z1-tx);border-color:var(--z1)}
.z2{background:var(--z2-bg);color:var(--z2-tx);border-color:var(--z2)}
.c-ok{background:var(--ok-bg);color:var(--ok-tx)} .c-bad{background:var(--bad-bg);color:var(--bad-tx)} .c-warn{background:var(--warn-bg);color:var(--warn-tx)} .c-info{background:var(--info-bg);color:var(--info-tx)} .c-gris{background:var(--gris-bg);color:var(--gris-tx)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--panel2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.alerta td{background:var(--bad-bg)} tr.aviso td{background:var(--warn-bg)}
tr.rev td{opacity:.72}
.pg{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.vacio{padding:34px 12px;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sombra);cursor:pointer;border-left:6px solid var(--zc,var(--line))}
.card.z1c{--zc:var(--z1)} .card.z2c{--zc:var(--z2)}
.card h3{margin:0 0 4px;font-size:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;margin:6px 0}
.card .kv span:nth-child(odd){color:var(--mut)}
.card .kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dif-ok{color:var(--ok)} .dif-bad{color:var(--bad)} .dif-warn{color:var(--warn)}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pend{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sombra)}
.pend.ALTA{border-left:6px solid var(--bad)} .pend.MEDIA{border-left:6px solid var(--warn)} .pend.hecho{opacity:.65}
.pend .t{font-weight:800} .pend .d{font-size:13px;color:var(--mut)}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.prog .bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov{position:fixed;inset:0;background:rgba(2,8,23,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{background:var(--bg);width:100%;max-width:1100px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.ov.md{align-items:center}
.ov.md .sheet{max-width:440px;border-radius:18px;max-height:90vh}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));background:#0f172a;color:#fff;border-radius:12px;padding:11px 16px;z-index:200;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw}
.toast.err{background:#991b1b}
.toast button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.estado{padding:50px 10px;text-align:center;color:var(--mut)}
.spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:g 1s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}
html,body{overflow-x:hidden}
body{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(60px,env(safe-area-inset-bottom))}
#btnMas,.solo-m,.zsel,.tg,th.tg{display:none}
tr.det{display:none}
.chip{font-size:13px}
.ycard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sombra)}
.ycard.sin{border-left-color:var(--bad);background:var(--bad-bg)} .ycard.dif{border-left-color:var(--warn)}
.ycard .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ycard .m{font-size:19px;font-weight:800}
.ycard .tk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;padding:5px 8px;margin-top:4px;background:var(--panel2);border-radius:8px}
.ycard .f{font-size:14px;margin-top:6px}
.cand{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;border:1px dashed var(--m-vir);font-size:13px}
.dtl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.dtl span b{color:var(--mut);font-weight:700}
.ov.md{justify-content:center;align-items:center}
@media (pointer:coarse){.btn.sm,.seg button,.seg.sm button,.tabs button,.cc,.cc .solo{min-height:44px}.cc .solo{padding:4px 10px}.acciones{gap:10px}}
@media (min-width:1101px){
  .ov:not(.md){justify-content:flex-end;align-items:stretch}
  .ov:not(.md) .sheet{max-width:680px;max-height:100%;height:100%;border-radius:18px 0 0 18px}
}
@media (max-width:1100px){
  td.sc,th.sc{display:none}
  .tg,th.tg{display:table-cell}
  tr.open + tr.det{display:table-row}
  tr.det td{background:var(--panel2)}
  .tg .btn{min-height:44px}
}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px} .kpi{padding:10px 12px} .kpi .v{font-size:19px}
  .vs{grid-template-columns:1fr} .vs>div.nosel{display:none}
  .zsel{display:inline-flex;margin-bottom:8px}
  .grid{grid-template-columns:1fr}
  .pend{grid-template-columns:1fr}
  #btnMas{display:inline-block}
  .sticky .row{gap:6px} .sticky .row .seg{flex:0 0 auto} #fCajero{flex:1;min-width:120px}
  #panelSec{display:none}
  #panelSec.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;z-index:90;background:var(--bg);padding:14px max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.45);border-top:1px solid var(--line)}
  .solo-m{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ov .sheet,.ov.md .sheet{max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0}
  .ov.md{align-items:stretch}
  .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
  table,tbody{display:block} thead{display:none}
  tbody tr{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;box-shadow:var(--sombra)}
  tr.alerta td,tr.aviso td{background:transparent} tr.alerta{background:var(--bad-bg)!important} tr.aviso{background:var(--warn-bg)!important}
  td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:5px 0;text-align:right;font-size:15px}
  td::before{content:attr(data-label);color:var(--mut);font-weight:700;text-align:left;font-size:14px;flex:0 0 auto}
  td.tg{display:block;text-align:center} td.tg::before{content:none}
  tr.det{display:none!important} tr.open + tr.det{display:block!important;padding-top:0;margin-top:-12px}
  tr.det td{display:block;text-align:left} tr.det td::before{content:none}
  .pg{padding:10px 0}
}
@media print{
  body{padding:0;background:#fff} .noprint,.sticky .row,.acciones,.tabs{display:none!important}
  .sticky{position:static;border:0} .tw{overflow:visible;box-shadow:none} th{position:static}
  .card{break-inside:avoid;box-shadow:none} .ov{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top noprint">
    <h1>🧾 Control de cajas</h1>
    <button class="btn" id="btnCsv" title="Descargar la pestaña actual en CSV">⬇ CSV</button>
    <button class="btn" id="btnPrint" title="Imprimir o guardar en PDF">🖨 Imprimir</button>
    <button class="btn" id="btnTema" title="Cambiar entre fondo claro y oscuro">🌙</button>
    <button class="btn" id="btnFull" title="Pantalla completa">⛶</button>
    <button class="btn pri" id="btnAct" title="Volver a consultar la base">↻ Actualizar</button>
    <span class="gen" id="gen"></span>
  </div>
  <div id="banner"></div>
  <div class="rango noprint" id="rango">
    <div class="seg sm" id="atajos">
      <button data-a="hoy">Hoy</button><button data-a="sem">Esta semana</button><button data-a="pas">Semana pasada</button>
    </div>
    <label>Desde <input type="date" id="fDesde"></label>
    <label>Hasta <input type="date" id="fHasta"></label>
  </div>
  <div class="sticky" id="barra">
    <div class="row">
      <div class="seg" id="fZona"><button data-v="TODAS">Todas</button><button data-v="ZONA-01">Z01</button><button data-v="ZONA-02">Z02</button></div>
      <select id="fCajero" aria-label="Cajero"></select>
      <input type="search" id="fQ" placeholder="Buscar cliente, ticket, concepto…" aria-label="Buscar">
      <button class="btn sm" id="btnMas">⚙ Filtros</button>
    </div>
    <div class="activos" id="activos"></div>
  </div>
  <div id="panelSec" class="noprint">
    <div class="solo-m"><b style="font-size:17px">Filtros</b><button class="btn pri" id="btnCerrarF">Listo</button></div>
    <div class="sec">
      <span class="lbl">Estado</span>
      <div class="seg sm" id="fEstado"><button data-v="">Todas</button><button data-v="A">Abiertas</button><button data-v="C">Cerradas</button></div>
      <span class="lbl">Revisión</span>
      <div class="seg sm" id="fRev"><button data-v="">Todas</button><button data-v="alertas">Con alertas</button><button data-v="sinrev">Sin revisar</button></div>
      <span class="lbl">Método</span>
      <select id="fMetodo"><option value="">Todos</option><option>EFECTIVO</option><option>VIRTUAL</option><option>CREDITO</option><option>POR_COBRAR</option><option>MIXTO</option></select>
    </div>
    <div class="sec">
      <span class="lbl">Día</span>
      <div class="seg sm" id="fDia"><button data-v="">Todos</button><button data-v="0">Lun</button><button data-v="1">Mar</button><button data-v="2">Mié</button><button data-v="3">Jue</button><button data-v="4">Vie</button><button data-v="5">Sáb</button><button data-v="6">Dom</button></div>
      <button class="btn sm" id="btnLimpiar">Limpiar filtros</button>
    </div>
    <div class="sec"><span class="lbl">Cajas</span><span id="cajasInfo" style="font-size:12.5px;color:var(--mut)"></span></div>
    <div class="cajaschips" id="cajasChips"></div>
  </div>
  <div id="cuerpo"><div class="estado"><div class="spin"></div>Cargando…</div></div>
</div>
<div id="capas"></div>

<script>
'use strict';
const SB_URL  = 'https://rzbzdeipbtqkzjqdchqk.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6YnpkZWlwYnRxa3pqcWRjaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzYwMDQsImV4cCI6MjA5NjQ1MjAwNH0.MAlSdz_ugGUZoaU5st6dA_gb_x_IiUL0TXxH176kY9k';
const PAGE = 60;
const TZ = 'America/Lima';
const SIN_CAPTOR = { 'ZONA-01': true };   // Zona 01 no tiene captor Yape: no es culpa del cajero
const $ = id => document.getElementById(id);
const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (_) { return null; } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100;
const nf2 = new Intl.NumberFormat('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const S = n => (money(n) < 0 ? '−' : '') + 'S/ ' + nf2.format(Math.abs(money(n)));
const SS = n => (money(n) > 0 ? '+' : '') + S(n);
const hap = (p) => { try { navigator.vibrate && navigator.vibrate(p || 10); } catch (_) {} };
const zn = z => String(z || '').replace('ZONA-', 'Z');
const zchip = z => z ? '<span class="chip ' + (z === 'ZONA-01' ? 'z1' : 'z2') + '">' + esc(zn(z)) + '</span>' : '';
const zcls = z => z === 'ZONA-01' ? 'z1c' : 'z2c';
const NIV = { ALTA: 2, MEDIA: 1, BAJA: 0 };

// ── tiempo (Lima) ───────────────────────────────────────────
function parseTs(s) {
  if (s == null || s === '') return NaN;
  if (typeof s === 'number') return s;
  s = String(s).trim().replace(' ', 'T');
  if (s.length === 10) s += 'T00:00:00-05:00';
  else if (!/(Z|[+-]\d\d(:?\d\d)?)$/.test(s.slice(10))) s += '-05:00';
  return Date.parse(s);
}
const fmtP = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function limaParts(ms) { const o = {}; fmtP.formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; }); return o; }
