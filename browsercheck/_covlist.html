<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#070d18;font-family:system-ui,-apple-system,sans-serif;padding:16px}
.cov-card{width:min(560px,100%);background:linear-gradient(180deg,#0f1a2c,#0b1220);border:1px solid #223049;border-radius:20px;padding:16px;box-sizing:border-box}
.cov-tit-txt b{font-size:15px;font-weight:800;color:#eaf1fb;display:block}
.cov-tit-txt span{font-size:11px;color:#6b7d9c;font-weight:600;font-family:ui-monospace,monospace}
.cov-regs-tit{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5f7192;margin:12px 2px 6px}
.cov-regs{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.cov-reg{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;background:#0a1120;border:1px solid #182338;cursor:pointer}
.cov-reg.on{border-color:#3a5170;background:#111d34}
.cov-reg.is-p{border-left:3px solid #34d399}.cov-reg.is-c{border-left:3px solid #fbbf24}
.cov-reg-ic{font-size:12px;flex:none}
.cov-reg-v{font-size:13px;font-weight:800;font-family:ui-monospace,monospace;color:#eaf1fb;flex:none;min-width:64px}
.cov-reg.is-p .cov-reg-v{color:#34d399}.cov-reg.is-c .cov-reg-v{color:#fbbf24}
.cov-reg-f{font-size:11px;color:#7488a6;font-weight:600;flex:1}
.cov-reg-u{font-size:11px;color:#93a4c2;font-weight:700;flex:none}
.cov-det-card{border:1px solid #223049;border-radius:12px;padding:12px 13px;background:#0c1626;border-left:3px solid #34d399;margin-top:4px}
.cov-det-top{display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1a2740}
.cov-det-tag{font-size:11px;font-weight:800;color:#aebbd2}.cov-det-val{font-size:18px;font-weight:800;font-family:ui-monospace,monospace;color:#34d399}
.cov-det-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#c3cee0;padding:3px 0}
.cov-det-k{font-size:10px;font-weight:800;text-transform:uppercase;color:#5f7192}
</style></head>
<body><div class="cov-card">
  <div class="cov-tit-txt"><b>MANI ENTERO TOSTADO GRANEL</b><span>00162 · LEV148</span></div>
  <div class="cov-regs-tit">📋 Registros</div>
  <div class="cov-regs">
    <div class="cov-reg is-p on"><span class="cov-reg-ic">💚</span><span class="cov-reg-v">S/ 12.00</span><span class="cov-reg-f">27 jul · 09:46 p.m.</span><span class="cov-reg-u">Luis</span></div>
    <div class="cov-reg is-p"><span class="cov-reg-ic">💚</span><span class="cov-reg-v">S/ 11.00</span><span class="cov-reg-f">27 jul · 09:45 p.m.</span><span class="cov-reg-u">Luis</span></div>
    <div class="cov-reg is-c"><span class="cov-reg-ic">🟡</span><span class="cov-reg-v">S/ 10.00</span><span class="cov-reg-f">11 jul · 05:09 p.m.</span><span class="cov-reg-u">Luis</span></div>
  </div>
  <div class="cov-det-card">
    <div class="cov-det-top"><span class="cov-det-tag">💚 Cambio de precio</span><b class="cov-det-val">S/ 12.00</b></div>
    <div class="cov-det-row"><span class="cov-det-k">Cuándo</span><span>27 de julio de 2026 · 21:46</span></div>
    <div class="cov-det-row"><span class="cov-det-k">Quién</span><span>Luis</span></div>
    <div class="cov-det-row"><span class="cov-det-k">Vía</span><span>🏷 Catálogo</span></div>
  </div>
</div>
<script>const {chromium}=0</script>
</body></html>
