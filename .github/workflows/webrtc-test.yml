# [MosGuard] Prueba el WebRTC nativo en un EMULADOR de Android en la nube — sin depender del celular del
# dueño (que se dormía por Doze). Corre EspiaIceTest: ¿setLocalDescription completa y junta candidatos ICE?
# El resultado (con el detalle setLocalDescription/gathering/candidatos) queda en el log del job.
name: WebRTC ICE test

on:
  push:
    paths:
      - 'android/app/src/androidTest/**'
      - 'android/app/src/main/java/dev/levo/yapecaptor/EspiaNativo.kt'
      - '.github/workflows/webrtc-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Habilitar KVM (acelera el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr EspiaIceTest en emulador (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PtestAbi --stacktrace
