# Compila el APK de YapeCaptor en la nube.
#
# En la PC del dueño no hay Java, ni Gradle, ni el SDK de Android — y no hace falta que los haya:
# GitHub trae todo eso instalado en sus máquinas. Cada vez que cambia algo dentro de android/,
# este flujo compila el APK y lo deja para descargar desde la pestaña Actions del repo.
#
# El APK sale firmado con la clave de depuración de Android. Es una app interna que se instala a
# mano en los celulares del negocio, no va a Play Store, así que no necesita firma de publicación
# — y de esta forma el archivo que baja ya es instalable, sin pasos extra.
name: APK YapeCaptor

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk-yape.yml'
  workflow_dispatch:        # botón "Run workflow" para compilar cuando se quiera

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # para guardar la clave de firma la primera vez
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      # Android rechaza instalar una actualización firmada con otra clave. La de depuración
      # cambia en cada corrida, así que se crea UNA vez y queda guardada en el repo: de ahí en
      # más las actualizaciones se instalan encima y el celular conserva su emparejamiento.
      - name: Clave de firma estable
        working-directory: android
        run: |
          if [ ! -f keystore/yape.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/yape.jks               -storepass yapecaptor -keypass yapecaptor -alias yape               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=YapeCaptor, OU=Levo.dev, O=InversionMos, L=Pisco, C=PE"
            echo "CLAVE_NUEVA=1" >> $GITHUB_ENV
            echo "Clave de firma creada por primera vez."
          else
            echo "Clave de firma ya existente — las actualizaciones se instalan encima."
          fi

      - name: Guardar la clave si se creó recién
        if: env.CLAVE_NUEVA == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/keystore/yape.jks
          git commit -m "YapeCaptor: clave de firma estable (creada por CI, no cambiar)"
          git push

      - name: Numerar la version
        run: |
          echo "APK_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "APK_VERSION_NAME=1.$(date +%y%m).${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar con la fecha
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/YapeCaptor-$(date +%Y%m%d-%H%M).apk"
          ls -lh out

      - name: Subir el APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: YapeCaptor-apk
          path: android/out/*.apk
          retention-days: 90

      # Ademas del artefacto (que exige estar logueado en GitHub para bajarlo), se publica como
      # RELEASE: eso da una URL directa y publica. Es la que usa la propia app para avisar que
      # hay version nueva y descargarla sola — sin que nadie tenga que entrar a Actions.
      - name: Publicar la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yape-v${{ github.run_number }}
          name: YapeCaptor ${{ env.APK_VERSION_NAME }}
          body: |
            APK de captura de Yapes.
            versionCode: ${{ github.run_number }} · versionName: ${{ env.APK_VERSION_NAME }}

            Se instala encima de la anterior (firma estable): no hace falta desinstalar
            ni volver a emparejar.
          files: android/out/*.apk
          make_latest: true
